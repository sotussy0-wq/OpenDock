name: Build installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconsole --onefile --name OpenDock --icon icon.ico --collect-data tzdata opendock.py
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with: { name: OpenDock-Setup, path: installer_out/OpenDock-Setup.exe }
